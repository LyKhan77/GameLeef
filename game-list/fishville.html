<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FishVille — 3D Aquarium</title>
<style>
  :root { --panel: rgba(10, 20, 30, 0.82); --line: rgba(140, 200, 255, 0.18); --accent: #4fd1ff; --gold: #ffd34f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1118; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: manipulation; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 60%, rgba(0,0,0,0.38) 100%); z-index: 1; }

  /* z-index scale: 1 vignette · 2 HUD panels · 3 toasts/tip · 10 modals · 100 loader */
  .panel { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; color: #dceeff; box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
  .panel.blurred { backdrop-filter: blur(8px); }

  #titlebar { top: 16px; left: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 14px; }
  #titlebar h1 { font-size: 20px; letter-spacing: 3px; font-weight: 800; color: #fff; text-shadow: 0 0 12px rgba(79,209,255,0.6); }
  #titlebar h1 span { color: var(--accent); }
  #coinPill { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--gold); background: rgba(255, 211, 79, 0.12); border: 1px solid rgba(255, 211, 79, 0.4); padding: 5px 14px; border-radius: 999px; transition: transform .15s, box-shadow .3s; }
  #coinPill svg { width: 16px; height: 16px; }
  #coinPill.bump { transform: scale(1.15); box-shadow: 0 0 14px rgba(255, 211, 79, 0.55); }
  #timePill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #bfe4ff; background: rgba(79, 209, 255, 0.1); border: 1px solid rgba(79, 209, 255, 0.35); padding: 5px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  #timePill svg { width: 14px; height: 14px; }

  #rightCol { position: fixed; top: 16px; right: 16px; z-index: 2; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  #actions { position: static; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  #actions button { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 176px; min-height: 44px; padding: 9px 14px; font-size: 15px; font-weight: 600; color: #eaf6ff; background: rgba(79, 209, 255, 0.12); border: 1px solid rgba(79, 209, 255, 0.35); border-radius: 10px; cursor: pointer; transition: background .15s, transform .05s; }
  #actions button svg { width: 16px; height: 16px; flex: none; }
  #actions button:hover:not(:disabled) { background: rgba(79, 209, 255, 0.25); }
  #actions button:active:not(:disabled) { transform: scale(0.97); }
  #actions button:disabled { opacity: 0.45; cursor: not-allowed; }
  #actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #btnReset { margin-top: 4px; }
  #actions button small { color: var(--gold); font-weight: 700; }
  #actions button.warn { border-color: rgba(255, 120, 90, 0.5); background: rgba(255, 120, 90, 0.1); }

  /* Inhabitants HUD — 3 levels: strip (minimize) / modal (expand) / hidden */
  #strip { position: static; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 9px 12px; }
  #stripCounts { display: flex; align-items: center; gap: 12px; }
  #feedQtyWrap { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: -2px; }
  #feedQtyWrap button { min-width: 0; min-height: 0; width: 30px; height: 30px; padding: 0; gap: 0; justify-content: center; font-size: 16px; font-weight: 700; border-radius: 8px; }
  #feedQtyWrap span { min-width: 58px; text-align: center; font-size: 12.5px; font-weight: 600; color: #bfe4ff; }
  #strip.hidden { display: none; }
  #strip .cnt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #bfe4ff; }
  #strip .cnt svg { width: 15px; height: 15px; color: var(--accent); }
  #strip .cnt.eggs svg { color: var(--gold); }
  .iconBtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; color: #bfe4ff; background: rgba(79, 209, 255, 0.1); border: 1px solid rgba(79, 209, 255, 0.3); border-radius: 8px; cursor: pointer; transition: background .15s; }
  .iconBtn svg { width: 15px; height: 15px; }
  .iconBtn:hover { background: rgba(79, 209, 255, 0.25); }
  #btnShowStrip { align-self: center; position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: #dceeff; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  #btnShowStrip svg { width: 20px; height: 20px; color: var(--accent); }
  #btnShowStrip.hidden { display: none; }
  #resWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #resWrap.hidden { display: none; }
  #resBox { width: min(620px, 94vw); max-height: 84vh; display: flex; flex-direction: column; text-align: left; padding: 18px 20px; }
  #resBox h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8fd4ff; margin-bottom: 2px; }
  #resBox h3 svg { width: 16px; height: 16px; color: var(--accent); }
  #resSub { font-size: 11px; color: #9fb8cc; margin-bottom: 12px; }
  #resList { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; padding-right: 4px; }
  .resRow { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); }
  .resImg { width: 118px; height: 88px; flex: none; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 38%, #152a3e 0%, #0b1620 78%); }
  .resInfo { flex: 1; min-width: 0; }
  .resInfo .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .resInfo b { display: inline-flex; align-items: center; gap: 7px; color: #fff; font-size: 14px; }
  .resInfo b svg { width: 16px; height: 16px; }
  .resInfo .sp { color: #7dd3fc; font-size: 11px; }
  .resInfo .stage { font-size: 11px; color: #9fb8cc; }
  .variant { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); font-size: 11px; font-weight: 600; }
  .variant svg { width: 11px; height: 11px; }
  .resRow .bar { margin-top: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .resRow .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fd1ff, #7dff9e); border-radius: 3px; transition: width .4s; }
  .resRow .bar.hunger i { background: linear-gradient(90deg, #ff9e6e, #ff5f4f); }
  .resRow .bar.age i { background: linear-gradient(90deg, #7dff9e, #ffd34f, #ff5f4f); }
  .resRow .hatch { color: #ffd34f; font-size: 11px; }
  #resEmpty { color: #7d97ad; font-size: 13px; padding: 4px 2px; }
  #btnResClose, #btnShopClose, #btnAwayClose { margin-top: 12px; align-self: center; padding: 9px 28px; font-size: 13px; font-weight: 700; color: #eaf6ff; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }

  /* Shop (Ronde 10) — feed + telur per spesies */
  #shopWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #shopWrap.hidden { display: none; }
  #shopBox { width: min(470px, 94vw); max-height: 84vh; display: flex; flex-direction: column; text-align: left; padding: 18px 20px; }
  #shopBox h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8fd4ff; margin-bottom: 2px; }
  #shopBox h3 svg { width: 16px; height: 16px; color: var(--gold); }
  #shopSub { font-size: 11px; color: #9fb8cc; margin-bottom: 12px; }
  #shopList { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; padding-right: 4px; }
  .shopRow { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); }
  .shopImg { width: 84px; height: 64px; flex: none; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 38%, #152a3e 0%, #0b1620 78%); }
  #shopFeedRow #feedQtyWrap { margin-top: 6px; justify-content: flex-start; }
  #shopFeedRow #feedQtyWrap span { min-width: 0; }
  .buyBtn { flex: none; min-height: 34px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: #eaf6ff; background: rgba(255, 211, 79, 0.14); border: 1px solid rgba(255, 211, 79, 0.4); border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .buyBtn:hover { background: rgba(255, 211, 79, 0.28); }
  .buyBtn:disabled { opacity: .45; cursor: default; background: rgba(255,255,255,0.05); border-color: var(--line); }
  .sellBtn { flex: none; min-height: 28px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; color: #ffd34f; background: rgba(255, 211, 79, 0.10); border: 1px solid rgba(255, 211, 79, 0.4); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .sellBtn:hover { background: rgba(255, 211, 79, 0.24); }
  .sellBtn svg { width: 12px; height: 12px; }

  /* Ronde 13 — away report ("While you were away") */
  #awayWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #awayWrap.hidden { display: none; }
  #awayBox { width: min(430px, 94vw); max-height: 84vh; display: flex; flex-direction: column; text-align: left; padding: 18px 20px; }
  #awayBox h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8fd4ff; margin-bottom: 2px; }
  #awayBox h3 svg { width: 16px; height: 16px; color: var(--accent); }
  #awaySub { font-size: 11px; color: #9fb8cc; margin-bottom: 12px; }
  #awayList { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; padding-right: 4px; }
  .awayRow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 12px; color: #eaf6ff; line-height: 1.4; }
  .awayRow svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
  /* Ronde 15 — modal konfirmasi generik (Buy/Sell/Reset) */
  #confirmWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #confirmWrap.hidden { display: none; }
  #confirmBox { width: min(430px, 94vw); display: flex; flex-direction: column; text-align: left; padding: 18px 20px; }
  #confirmBox h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8fd4ff; margin-bottom: 2px; }
  #confirmText { font-size: 13px; color: #cfe8ff; margin-bottom: 14px; line-height: 1.5; }
  #confirmActions { display: flex; justify-content: flex-end; gap: 10px; }
  #confirmActions button { padding: 9px 22px; font-size: 13px; font-weight: 700; border-radius: 10px; cursor: pointer; }
  #btnConfirmNo { color: #eaf6ff; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); }
  #btnConfirmYes { color: #0b1118; background: linear-gradient(180deg, #ffd34f, #ffb52e); border: 1px solid rgba(255, 211, 79, 0.8); }

  #hint { bottom: 16px; left: 16px; padding: 10px 16px; font-size: 13px; color: #cfe8ff; max-width: 46vw; }
  #toasts { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 9px 18px; border-radius: 999px; background: rgba(8, 18, 28, 0.85); border: 1px solid rgba(140, 200, 255, 0.3); color: #eaf6ff; font-size: 13px; font-weight: 600; animation: toastIn 2.6s ease forwards; }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(14px); } 12% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  .toast.status { display: inline-flex; align-items: center; gap: 9px; }
  .toast.status svg { width: 18px; height: 18px; flex: none; }
  #tip { position: fixed; z-index: 3; pointer-events: none; padding: 4px 10px; border-radius: 7px; background: rgba(8,18,28,0.9); border: 1px solid rgba(140, 200, 255, 0.35); color: #fff; font-size: 13px; display: none; }
  #credit { bottom: 16px; right: 16px; padding: 6px 12px; font-size: 11px; color: #6d8aa3; }
  #slotWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #slotWrap.hidden { display: none; }
  #slotBox { width: 350px; text-align: center; padding: 20px 24px; }
  #slotBox h3 { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 15px; letter-spacing: 2px; color: #ffd34f; }
  #slotBox h3 svg { width: 16px; height: 16px; }
  #slotSub { font-size: 11px; color: #9fb8cc; margin-bottom: 14px; }
  #reels { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .reel { width: 72px; height: 72px; overflow: hidden; border-radius: 10px; background: #0a1219; border: 2px solid rgba(255, 211, 79, 0.55); box-shadow: inset 0 0 14px rgba(0,0,0,0.6); }
  .reel .strip { display: flex; flex-direction: column; transition: none; }
  .reel .strip span { height: 72px; display: flex; align-items: center; justify-content: center; }
  .reel .strip span svg { width: 40px; height: 40px; }
  .reel.idle .strip { animation: reelIdle linear infinite; }
  @keyframes reelIdle { from { transform: translateY(-216px); } to { transform: translateY(0); } }
  #btnSpin { margin: 0 auto; display: block; padding: 10px 30px; font-size: 15px; font-weight: 700; color: #0b1118; background: linear-gradient(180deg, #ffd34f, #ffb52e); border: 1px solid rgba(255, 211, 79, 0.8); border-radius: 10px; cursor: pointer; }
  #btnSpin:disabled { opacity: 0.5; cursor: not-allowed; }
  #slotResult { margin-top: 12px; min-height: 20px; font-size: 15px; font-weight: 700; color: #ffd34f; }
  #breedWrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(4, 9, 15, 0.6); }
  #breedWrap.hidden { display: none; }
  #breedBox { width: 330px; text-align: center; padding: 18px 20px; }
  #breedBox h3 { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 15px; letter-spacing: 2px; color: #ffd34f; }
  #breedBox h3 svg { width: 16px; height: 16px; }
  #breedSub { font-size: 11px; color: #9fb8cc; margin-bottom: 12px; }
  #breedList { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; scrollbar-width: thin; margin-bottom: 14px; }
  .breedPick { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 10px 14px; font-size: 13px; font-weight: 600; color: #eaf6ff; background: rgba(79, 209, 255, 0.1); border: 1px solid rgba(79, 209, 255, 0.3); border-radius: 10px; cursor: pointer; }
  .breedPick svg { width: 16px; height: 16px; flex: none; }
  .breedPick b { color: #fff; }
  .breedPick span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 400; color: #9fb8cc; }
  .breedPick span svg { width: 11px; height: 11px; }
  .breedPick:hover { background: rgba(79, 209, 255, 0.22); }
  .breedPick.pick { background: rgba(255, 211, 79, 0.16); border-color: rgba(255, 211, 79, 0.65); }
  #btnBreedCancel { padding: 9px 26px; font-size: 13px; font-weight: 700; color: #eaf6ff; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  #breedActions { display: none; gap: 8px; margin-bottom: 10px; }
  #breedActions.on { display: flex; }
  #breedActions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 10px; font-size: 13px; font-weight: 700; color: #eaf6ff; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  #breedActions button svg { width: 14px; height: 14px; }
  #btnBreedGo { background: rgba(255, 211, 79, 0.18); border-color: rgba(255, 211, 79, 0.65); }
  #btnBreedGo:hover { background: rgba(255, 211, 79, 0.32); }
  .pairRow { display: flex; align-items: stretch; gap: 8px; }
  .pairCard { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 74px; padding: 10px 8px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(255, 211, 79, 0.10); border: 1px solid rgba(255, 211, 79, 0.5); border-radius: 10px; }
  .pairCard svg { width: 22px; height: 22px; }
  .pairCard small { display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 400; color: #9fb8cc; }
  .pairCard small svg { width: 10px; height: 10px; }
  .pairX { align-self: center; font-size: 16px; font-weight: 700; color: #ffd34f; }
  #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #0b1118 0%, #101c28 55%, #182634 100%); transition: opacity .8s; }
  #loader.fade { opacity: 0; pointer-events: none; }
  #loadTitle { font-size: 34px; font-weight: 700; letter-spacing: 10px; color: #eaf6ff; margin-bottom: 6px; }
  #loadTitle span { color: var(--accent); }
  #loadSub { color: #7d97ad; font-size: 11px; letter-spacing: 4px; margin-bottom: 34px; }
  #loadScene { position: relative; width: 320px; height: 96px; margin-bottom: 22px; }
  .lf { position: absolute; left: 0; width: 30px; height: 18px; animation: lfAcross linear infinite; }
  .lf::before { content: ""; position: absolute; left: 7px; top: 0; width: 24px; height: 18px; background: var(--c, #4fd1ff); border-radius: 50%; }
  .lf::after { content: ""; position: absolute; left: 0; top: 50%; width: 0; height: 0; margin-top: -7px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 9px solid var(--c, #4fd1ff); }
  .lfr { animation-name: lfAcrossR; }
  @keyframes lfAcross { from { transform: translateX(-50px); } to { transform: translateX(350px); } }
  @keyframes lfAcrossR { from { transform: translateX(350px) scaleX(-1); } to { transform: translateX(-50px) scaleX(-1); } }
  .lb { position: absolute; bottom: 0; width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(140,200,255,0.4); background: rgba(140,200,255,0.1); animation: lbRise linear infinite; }
  @keyframes lbRise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 0.7; } to { transform: translateY(-90px); opacity: 0; } }
  #loadBar { width: 240px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  #loadBar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .3s; }
  #loadBar.err i { background: #ff5f4f; }
  #loadMsg { margin-top: 14px; color: #7d97ad; font-size: 12.5px; letter-spacing: 1px; animation: loadPulse 1.6s ease-in-out infinite; }
  #loadMsg.err { color: #ff8f7d; font-weight: 600; animation: none; }
  @keyframes loadPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  #hintTag { display: block; font-size: 10px; letter-spacing: 2px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; }
    #coinPill, #coinPill.bump { transition: none; transform: none; box-shadow: none; }
    #actions button:active:not(:disabled) { transform: none; }
    .lf, .lb, #loadMsg { animation: none; }
    .reel .strip { transition: none !important; }
    .reel.idle .strip { animation: none; }
    .resRow .bar i { transition: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div class="panel" id="titlebar">
  <h1>FISH<span>VILLE</span></h1>
  <div id="coinPill"></div>
  <div id="timePill"></div>
</div>

<div id="rightCol">
  <div class="panel" id="actions">
    <button id="btnFeed"></button>
    <button id="btnShop"></button>
    <button id="btnBreed"></button>
    <button id="btnMute"></button>
    <button id="btnReset" class="warn"></button>
  </div>

  <div class="panel" id="strip">
    <div id="stripCounts">
      <span class="cnt" id="cntFish"></span>
      <span class="cnt eggs" id="cntEggs"></span>
      <button id="btnExpand" class="iconBtn" title="Expand — view all residents" aria-label="Expand residents panel"></button>
      <button id="btnHideStrip" class="iconBtn" title="Hide panel" aria-label="Hide residents panel"></button>
    </div>
  </div>
  <button id="btnShowStrip" class="hidden" title="Show residents" aria-label="Show residents panel"></button>
</div>

  <div class="panel" id="hint"><span id="hintTag">TIP</span><span id="hintMsg"></span></div>
<div class="panel" id="credit">FishVille · low-poly tank</div>
<div id="toasts"></div>
<div id="tip"></div>

<div id="slotWrap" class="hidden">
  <div class="panel blurred" id="slotBox">
    <h3>TREASURE!</h3>
    <div id="slotSub">One free spin — pull the lever!</div>
    <div id="reels">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
    </div>
    <button id="btnSpin">SPIN</button>
    <div id="slotResult"></div>

<script>
(function () {
  var fill = document.querySelector('#loadBar i'),
      bar = document.getElementById('loadBar'),
      msg = document.getElementById('loadMsg'),
      loader = document.getElementById('loader'),
      start = performance.now(), done = false, failed = false;
  function finish() {
    if (done) return;
    var wait = Math.max(0, 1500 - (performance.now() - start));
    setTimeout(function () {
      done = true;
      msg.classList.remove('err');
      bar.classList.remove('err');
      fill.style.width = '100%';
      loader.classList.add('fade');
      setTimeout(function () { loader.remove(); }, 850);
    }, wait);
  }
  var tick = setInterval(function () {
    if (done || failed) { clearInterval(tick); return; }
    var s = (performance.now() - start) / 1000;
    fill.style.width = Math.min(90, 25 + s * 32) + '%';
    if (s > 12) {
      failed = true;
      msg.textContent = 'Connection problem — please check your internet connection';
      msg.classList.add('err');
      bar.classList.add('err');
      fill.style.width = '100%';
    }
  }, 100);
  var probe = setInterval(function () {
    if (window.__FV_BOOTED) { clearInterval(probe); finish(); }
  }, 100);
})();
</script>

function tone(freq, dur = 0.12, type = 'sine', vol = 0.14, when = 0, slideTo = 0) {
  if (state.muted) return;
  try {
    const c = ac();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + when);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + when + dur);
    g.gain.setValueAtTime(vol, c.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + when + dur + 0.03);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + when); o.stop(c.currentTime + when + dur + 0.05);
  } catch (e) { /* audio unavailable */ }
}

// Ronde 11 — target wander baru: 70% persisten mengikuti arah renang (S-curve/reversal alami),

function pickWander(f) {

    const dir = new THREE.Vector3().copy(f.vel).normalize();

    f.target.z += (Math.random() - 0.5) * 4;

    f.dashPoint.clamp(FISH_MIN, FISH_MAX);

}
// Ronde 11 — poke: ikan dash menjauh dari titik klik (diabaikan saat dying/breeding/cooldown)
function pokeFish(f, hitPoint) {

  const dir = new THREE.Vector3().subVectors(f.group.position, hitPoint);
  if (dir.lengthSq() < 0.001) dir.set(Math.random() - 0.5, 0, Math.random() - 0.5);
  dir.normalize();
  f.fleePoint.copy(f.group.position).addScaledVector(dir, FLEE_DIST);
  f.fleePoint.x += (Math.random() - 0.5) * 3;
  f.fleePoint.z += (Math.random() - 0.5) * 3;
  f.fleePoint.y = THREE.MathUtils.clamp(f.fleePoint.y, FISH_MIN.y + 0.5, FISH_MAX.y - 0.5);

const _look = new THREE.Object3D();
function updateFish(f, dt, t) {
  const st = STAGE[f.stage];
  f.scaleT = st.scale * SPECIES[f.speciesIdx].size * f.traits.size;
  f.group.scale.lerp(new THREE.Vector3(f.scaleT, f.scaleT, f.scaleT), Math.min(1, dt * 3));

  // death animation: slow down, sink to the sand, fade out
  if (f.dying) {
    f.dieT += dt;
    f.vel.multiplyScalar(Math.max(0, 1 - 2 * dt));
    f.group.position.addScaledVector(f.vel, dt);
    f.group.position.y = Math.max(TANK.sandTop + 0.2, f.group.position.y - 1.5 * dt);
    if (Math.random() < dt * 8) spawnBubble(f.group.position.x, f.group.position.z, true);
    f.group.userData.tailPivot.rotation.y = Math.sin(t * 2 + f.bobPhase) * 0.2;
    f.group.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = Math.max(0, 1 - f.dieT / DIE_DURATION); } });
    if (f.dieT >= DIE_DURATION) killFish(f);
    return;
  }

  // hunger builds up over time (fry get hungrier faster, adults slower)
  const stageMod = f.stage === 0 ? 1.15 : f.stage === 2 ? 0.9 : 1;
  f.hunger = Math.min(100, f.hunger + HUNGER_DECAY * stageMod * dt);
  // Ronde 8 — hunger bubble di atas kepala: tampil 5 s, cooldown 5 s, berulang selama masih lapar
  const bub = f.group.userData.bubble;
  const bstate = f.hunger >= STARVE_TOAST ? 2 : f.hunger >= HUNGER_ALERT ? 1 : 0;
  if (bstate === 0) {
    if (bub.userData.state) { bub.userData.state = 0; bub.visible = false; f.bubbleT = 0; }
  } else if (bstate !== bub.userData.state) {
    bub.userData.state = bstate;
    bub.userData.setText(bstate === 2 ? 'STARVING!' : 'HUNGRY!', bstate === 2 ? '#ff6a4d' : '#ffd34f');
    bub.visible = true;
    f.bubbleT = t + BUBBLE_ON; // baru jadi lapar/starving: tampil dulu, lalu cooldown
  } else if (t >= f.bubbleT) {
    bub.visible = !bub.visible;
    f.bubbleT = t + (bub.visible ? BUBBLE_ON : BUBBLE_COOLDOWN);
  }

  // Ronde 14 — growth pasif dihapus; vonis kelaparan: saat bar hunger penuh (100) starveT berjalan,
  // makan satu flake me-reset (lihat eatFood). Fry/juv 3 jam, adult 5 jam (STARVE_KILL).
  if (f.hunger >= 100) {
    f.starveT += dt;
    if (f.starveT >= STARVE_KILL[f.stage]) { startDying(f, 'starve'); return; }
  }

  if (f.stage === 2) {

      f.senior = true;
      tintSenior(f);
      toast(`${f.name} is getting old…`);
      sfx.senior();
    }
    if (f.age >= ADULT_LIFESPAN) { startDying(f); return; }
  }

  // Ronde 11 — timers behavior (runtime-only)
  f.fleeT = Math.max(0, f.fleeT - dt);
  f.pokeCd = Math.max(0, f.pokeCd - dt);

  // food seeking (only hungry fish go after food — full fish leave it for others)
  let nearest = null, nd = 1e9;
  for (const fl of state.foods) {
    const d = f.group.position.distanceTo(fl.m.position);
    if (d < nd) { nd = d; nearest = fl; }
  }
  const foodChase = !!(nearest && nd < 8 && f.hunger >= CHASE_HUNGER);
  const inBreeding = state.breeding && (state.breeding.a === f || state.breeding.b === f);
  const mv = SPECIES[f.speciesIdx].move;

  // Ronde 11 — mood machine (cruise/dash/hover) + target wander baru (persisten, band kedalaman)
  if (f.mood !== 'cruise') {
    f.moodT -= dt;
    if (f.moodT <= 0) { f.mood = 'cruise'; f.wander = 0; }
  }
  f.wander -= dt;

  // prioritas target (yang tinggi menang): poke/flee > breeding > food > mood
  let target = null, spMul = 1, turnMul = 1;

  else if (inBreeding) target = state.breeding.mid;
  else if (foodChase) target = nearest.m.position;
  else if (f.mood === 'hover') target = null; // diam di tempat — kepak pectoral di bawah tetap jalan
  else if (f.mood === 'bengong') target = null; // Ronde 12 — bengong: diam total, hanya ekor & fin kepak + body bob
  else if (f.mood === 'dash') { target = f.dashPoint; spMul = 1.7; }
  else target = f.target;

  const p = f.group.position;
  const desired = target ? new THREE.Vector3().subVectors(target, p).normalize()
    .multiplyScalar(st.speed * SPECIES[f.speciesIdx].speed * f.traits.speed * (f.hunger >= 95 ? STARVE_SPEED : 1) * (f.senior ? SENIOR_SPEED : 1) * spMul)
    : new THREE.Vector3();

  // Ronde 11 — social (hanya saat cruise): + = tarikan lemah ke tetangga sespesies; − = teritorial (jauhi)
  if (!f.fleeT && !inBreeding && !foodChase && f.mood === 'cruise' && mv.social) {
    let nb = null, bd = Infinity;
    for (const o of state.fish) {
      if (o === f || o.dying || o.speciesIdx !== f.speciesIdx) continue;
      const d = p.distanceToSquared(o.group.position);
      if (d < bd) { bd = d; nb = o; }
    }
    if (nb) {
      const range = mv.social > 0 ? 4 : 2.5;
      if (bd < range * range) {
        const to = new THREE.Vector3().subVectors(nb.group.position, p).normalize();
        if (mv.social > 0) desired.lerp(to.multiplyScalar(desired.length()), 0.35 * mv.social);
        else desired.addScaledVector(to, -mv.social * 1.5);
      }

  }

  // Ronde 11 — turn rate per spesies (ikan besar belok lambat)
  f.vel.lerp(desired, Math.min(1, dt * 1.6 * mv.turn * turnMul));
  if (f.mood === 'bengong') f.vel.multiplyScalar(Math.max(0, 1 - 5 * dt)); // Ronde 12 — decelerasi cepat agar benar-benar berhenti

  // Ronde 11 — separation: gaya tolak lembut agar tubuh tidak tumpang tindih.
  // Pasangan breeding dikecualikan — keduanya di-override ke titik mid yang sama.
  {
    const rF = SPECIES[f.speciesIdx].body.len * f.scaleT * 0.5;
    for (const o of state.fish) {
      if (o === f || o.dying) continue;
      if (inBreeding && o === (state.breeding.a === f ? state.breeding.b : state.breeding.a)) continue;
      const rO = SPECIES[o.speciesIdx].body.len * o.scaleT * 0.5;
      const minD = rF + rO;
      const dd = p.distanceTo(o.group.position);
      if (dd >= minD || dd < 1e-4) continue;
      const away = new THREE.Vector3().subVectors(p, o.group.position).normalize();
      f.vel.addScaledVector(away, SEP_K * (1 - dd / minD) * dt);
      if (dd < minD * 0.5) p.addScaledVector(away, (minD * 0.5 - dd) * 0.5);
    }
  }

  f.group.position.addScaledVector(f.vel, dt);

  // soft wall containment
  const m = 0.7;
  if (p.x < FISH_MIN.x + m) f.vel.x += (FISH_MIN.x + m - p.x) * 3 * dt;
  if (p.x > FISH_MAX.x - m) f.vel.x -= (p.x - FISH_MAX.x + m) * 3 * dt;
  if (p.y < FISH_MIN.y + m) f.vel.y += (FISH_MIN.y + m - p.y) * 3 * dt;
  if (p.y > FISH_MAX.y - m) f.vel.y -= (p.y - FISH_MAX.y + m) * 3 * dt;
  if (p.z < FISH_MIN.z + m) f.vel.z += (FISH_MIN.z + m - p.z) * 3 * dt;
  if (p.z > FISH_MAX.z - m) f.vel.z -= (p.z - FISH_MAX.z + m) * 3 * dt;
  p.clamp(FISH_MIN, FISH_MAX);

  // eating
  if (nearest && nd < 1.45 && f.hunger >= EAT_MIN_HUNGER) eatFood(f, nearest);

  // face direction of travel
  const spd = f.vel.length();
  if (spd > 0.3) {
    _look.position.copy(p);
    _look.lookAt(p.clone().add(f.vel));
    f.group.quaternion.slerp(_look.quaternion, Math.min(1, dt * 5));
  }
  p.y += Math.sin(t * 2 + f.bobPhase) * 0.02;

  // tail beat + fins (per-species amplitude/frequency; pectorals flap with a phase offset)
  const u = f.group.userData;
  const beat = t * (4 + spd * 2.5) * u.tailAnim.freq + f.bobPhase;
  u.tailPivot.rotation.y = Math.sin(beat) * u.tailAnim.amp;
  u.tailPivot.rotation.x = Math.sin(beat) * u.tailAnim.amp * 0.3;
  for (const pr of u.pec) {
    pr.pivot.rotation.z = -0.5 + Math.sin(t * 7 + f.bobPhase) * 0.35;

  const glow = inBreeding;

  u.bodyMat.emissiveIntensity = glow ? 0.55 + Math.pow(Math.max(0, Math.sin(t * 5.7)), 3) * 0.9 : 1;
}
function eatFood(f, fl) {

function updateFoods(dt, t) {

// ---------- Genetics (round 5 P1) ----------
const TRAIT_RANGE = { size: [0.8, 1.2], speed: [0.8, 1.2], hue: [-20, 20] };
const TRAIT_JITTER = { size: 0.06, speed: 0.06, hue: 8 };
function defaultTraits() { return { size: 1, speed: 1, hue: 0 }; }
function gauss() { // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function breedGenome(a, b) {
  // a/b: fish objects with {speciesIdx, traits}
  const cross = a.speciesIdx !== b.speciesIdx;
  const sp = cross ? (Math.random() < 0.5 ? a : b).speciesIdx : a.speciesIdx;
  const variant = cross && Math.random() < 0.10;
  const avg = k => THREE.MathUtils.clamp((a.traits[k] + b.traits[k]) / 2 + gauss() * TRAIT_JITTER[k], TRAIT_RANGE[k][0], TRAIT_RANGE[k][1]);
  const traits = { size: avg('size'), speed: avg('speed'), hue: avg('hue') };
  if (variant) traits.hue = THREE.MathUtils.clamp(traits.hue + (Math.random() < 0.5 ? -1 : 1) * (25 + Math.random() * 20), -45, 45);
  return { species: sp, traits, variant };
}
// ---------- Breeding system ----------
function canBreed() {

  return { adults, ready: adults.length >= 2 && state.breedCd <= 0 && !state.breeding };
}

function updateBreeding(dt) {
  if (state.breedCd > 0) state.breedCd = Math.max(0, state.breedCd - dt);
  const br = state.breeding;
  if (br) {
    br.t += dt;
    // Ronde 12 — love scene: hati + sparkles + cahaya pink mengikuti pasangan
    loveFX.visible = true; loveFX.position.copy(br.mid);
    loveHeartTimer += dt;
    while (loveHeartTimer >= HEART_EVERY) { loveHeartTimer -= HEART_EVERY; spawnLoveHeart(br.mid); }
    const beat = Math.pow(Math.max(0, Math.sin(br.t * 5.7)), 3);
    loveLight.intensity = 6 + beat * 10;
    loveGlow.material.opacity = 0.18 + beat * 0.3;
    for (const s of loveSparks) {
      const u = s.userData;
      s.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(br.t * 2 + u.ph) * 0.2, Math.sin(u.a) * u.r);
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(br.t * 2.5 + u.ph));
      s.material.opacity = tw;
      const ss = 0.14 + tw * 0.14;
      s.scale.set(ss, ss, 1);
    }
    if (br.t >= br.dur) {
      const [lo, hi] = eggRange(br.a, br.b); // Ronde 8 — shared with the confirm view
      const n = lo + Math.floor(Math.random() * (hi - lo + 1));
      for (let i = 0; i < n; i++) {
        const p = br.mid.clone().add(new THREE.Vector3((Math.random() - 0.5) * 5, 0, (Math.random() - 0.5) * 4));
        p.x = THREE.MathUtils.clamp(p.x, FISH_MIN.x + 0.5, FISH_MAX.x - 0.5);
        p.z = THREE.MathUtils.clamp(p.z, FISH_MIN.z + 0.5, FISH_MAX.z - 0.5);
        makeEgg(p, 0, breedGenome(br.a, br.b));
      }
      state.breeding = null;
      state.breedCd = BREED_CD;
      toast(`${br.a.name} & ${br.b.name} laid ${n} eggs!`);
      sfx.breed();
      for (let j = 0; j < 10; j++) spawnBubble(br.mid.x, br.mid.z, true);
      notifyResidents(); updateHint();
    }
  } else {
    loveFX.visible = false;
    loveLight.intensity = 0; loveGlow.material.opacity = 0;
    for (const s of loveSparks) s.material.opacity = 0;

  for (let i = loveHearts.length - 1; i >= 0; i--) {
    const h = loveHearts[i];
    h.life -= dt;
    if (h.life <= 0) { scene.remove(h.s); h.s.material.dispose(); loveHearts.splice(i, 1); continue; }
    h.s.position.y += h.vy * dt;
    h.s.position.x += Math.sin(h.s.position.y * 2 + h.ph) * 0.15 * dt;
    h.s.material.opacity = Math.min(1, (h.life / 2.5) * 3);

}

function makeChest() {
  const g = new THREE.Group();
  const wood = matFlat(0x7a4a21, 0.9), band = matFlat(0xffc53d, 0.9);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.1), wood);
  base.position.y = 0.45; base.castShadow = true;
  g.add(base);
  for (const x of [-0.45, 0.45]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.92, 1.14), band);
    b.position.set(x, 0.45, 0);
    g.add(b);
  }
  // lid, hinged at the back edge
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, 0.9, -0.55);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.1), wood);
  lid.position.set(0, 0.25, 0.55); lid.castShadow = true;
  const lidBand = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.52, 1.14), band);
  lidBand.position.set(0, 0.25, 0.55);
  lidPivot.add(lid, lidBand);
  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.08), band);
  lock.position.set(0, 0.78, 0.57);
  g.add(lidPivot, lock);
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.2), new THREE.MeshStandardMaterial({
    color: 0x4fd1ff, emissive: 0x4fd1ff, emissiveIntensity: 1.2, roughness: 0.3, flatShading: true,
  }));
  gem.position.set(0, 0.85, 0);
  g.add(gem);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffd34f, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(3.2, 3.2, 1);
  glow.position.y = 0.9;
  g.add(glow);
  // invisible raycast proxy (three r160 raycaster skips visible:false meshes)
  const proxy = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 2.0, 1.7),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  proxy.position.y = 1.0;
  g.add(proxy);
  g.userData = { lid: lidPivot, glow, proxy };
  return g;
}

// slot machine
const SLOT_SYMBOLS = [
  { ic: 'coin', w: 45 }, { ic: 'flakes', w: 25 }, { ic: 'fish', w: 20 }, { ic: 'gem', w: 10 },
];
const SLOT_IC_COLOR = { coin: '#ffd34f', flakes: '#ff9e6e', fish: '#4fd1ff', gem: '#7dd3fc' };
function slotReelIcon(ic, px = '40px') { return icon(ic, SLOT_IC_COLOR[ic], px); }
function rollSymbol() {
  let r = Math.random() * 100;
  for (const s of SLOT_SYMBOLS) { r -= s.w; if (r < 0) return s.ic; }
  return 'coin';
}
function evalReels(a, b, c) {
  if (a === b && b === c) {
    if (a === 'gem') return { coins: 60, eggs: 1, feeds: 0, label: 'JACKPOT — +60 coins +1 egg' };
    if (a === 'coin') return { coins: 40, eggs: 0, feeds: 0, label: 'Three coins — +40' };
    if (a === 'flakes') return { coins: 0, eggs: 0, feeds: 2, label: 'Three feeds — +2 free feeds!' };
    return { coins: 0, eggs: 2, feeds: 0, label: 'Three fish — +2 free eggs!' };
  }
  for (const [ic, coins] of [['gem', 25], ['fish', 25], ['flakes', 15], ['coin', 10]]) {
    if ([a, b, c].filter(x => x === ic).length === 2) return { coins, eggs: 0, feeds: 0, label: `Pair of ${ic} — +${coins} coins` };
  }
  return { coins: 3, eggs: 0, feeds: 0, label: 'No match — +3 coins' };
}
const slotWrap = $('slotWrap'), slotResult = $('slotResult'), btnSpin = $('btnSpin');
const reelStrips = [...document.querySelectorAll('#reels .strip')];

function resetReelsDisplay() {

  for (let i = 0; i < r.feeds; i++) dropFlakes();

  sfx.slotWin();
  slotSpun = true;
  btnSpin.disabled = false;
  btnSpin.textContent = 'Collect & Close';

// ---------- Picking (click, not drag) ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;
function setMouse(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const d = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const quick = performance.now() - downPos.t < 400;
  downPos = null;
  if (d > 6 || !quick) return; // it was a camera drag
  setMouse(e);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(rayTargets, false);
  if (!hits.length) return; // Ronde 12 — klik air kosong = tidak ada aksi (pairing via list modal)
  const pick = hits[0].object.userData.pick;
  if (!pick) return;
  if (pick.type === 'treasure') openTreasure(pick.ref);
  else if (pick.type === 'fish') {
    const f = pick.ref;
    for (let i = 0; i < 4; i++) spawnBubble(f.group.position.x, f.group.position.z, true);
    toast(`${f.name} — ${SPECIES[f.speciesIdx].name}${f.variant ? ' · variant' : ''}, ${STAGE[f.stage].name} (${f.growth.toFixed(1)} growth pts, belly ${Math.round(100 - f.hunger)}/100)`);
    pokeFish(f, hits[0].point); // Ronde 11 — poke: ikan dash menjauh dari titik klik
  }
});

window.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('confirmWrap').classList.contains('hidden')) closeConfirm(); else if (resOpen) closeResidents(); else if (shopOpen) closeShop(); else if (state.mating) cancelMating(); }); // Ronde 15 — confirm modal ditutup Esc dulu
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.buttons) { $('tip').style.display = 'none'; return; }
  setMouse(e);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(rayTargets, false);
  let hovered = null;
  if (hits.length) {
    const pick = hits[0].object.userData.pick;
    if (pick && pick.type === 'fish') { const f = pick.ref, sp = SPECIES[f.speciesIdx]; hovered = `${f.name} (${sp.name}${f.variant ? ' · variant' : ''}) · ${f.stage === 2 ? `Adult ${ageH(f.age)}h / 24h` : `${STAGE[f.stage].name} · belly ${Math.round(100 - f.hunger)}/100`}`; }
    else if (pick && pick.type === 'treasure') hovered = 'Treasure chest — click to open!';
  }
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
  const tip = $('tip');
  if (hovered) {
    tip.style.display = 'block';
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY + 14 + 'px';
    tip.textContent = hovered;
  } else tip.style.display = 'none';
});

// ---------- Main loop ----------
let listTimer = 0, hintTimer = 0;
const __FV_FPS = { n: 0, t: performance.now() };
function animate() {
  requestAnimationFrame(animate);
  { const now = performance.now(); __FV_FPS.n++; if (now - __FV_FPS.t >= 500) { window.__FV && (window.__FV.__fps = Math.round(__FV_FPS.n * 1000 / (now - __FV_FPS.t))); __FV_FPS.n = 0; __FV_FPS.t = now; } }
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // water surface waves (x/z are static; only y is animated)
  const wp = waterGeo.attributes.position;
  for (let i = 0; i < wp.count; i++) {
    const x = wp.getX(i), z = wp.getZ(i);
    wp.setY(i, Math.sin(x * 0.55 + t * 1.6) * 0.12 + Math.cos(z * 0.8 + t * 1.2) * 0.1 + Math.sin((x + z) * 0.35 + t * 2.2) * 0.05);
  }
  wp.needsUpdate = true;
  waterGeo.computeVertexNormals();

  for (const s of swayers) {
    s.obj.rotation.z = Math.sin(t * 0.9 + s.phase) * s.amp;
    s.obj.rotation.x = Math.cos(t * 0.7 + s.phase) * s.amp * 0.6;
  }
  for (const c of caustics) {
    c.m.position.x = THREE.MathUtils.clamp(c.m.position.x + Math.sin(t * c.speed + c.phase) * 0.15 * dt, -9, 9);
    c.m.position.z = THREE.MathUtils.clamp(c.m.position.z + Math.cos(t * c.speed * 0.8 + c.phase) * 0.15 * dt, -5.2, 5.2);
    c.m.material.opacity = 0.1 + Math.sin(t * 1.3 + c.phase) * 0.05;
  }

  bubbleTimer -= dt;
  if (bubbleTimer <= 0) {
    bubbleTimer = 0.28;
    const a = AERATORS[Math.floor(Math.random() * AERATORS.length)];
    spawnBubble(a[0], a[1]);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.m.position.y += b.vy * dt;
    b.m.position.x += Math.sin(t * 3 + b.phase) * 0.3 * dt;
    if (b.m.position.y > TANK.waterTop - 0.2) { scene.remove(b.m); bubbles.splice(i, 1); }
  }

  for (const f of state.fish) updateFish(f, dt, t);
  updateEggs(dt, t);
  updateFoods(dt, t);
  updateBreeding(dt);
  updateTreasure(dt, t);
  for (let i = state.floats.length - 1; i >= 0; i--) {
    const fl = state.floats[i];
    fl.t += dt;
    fl.spr.position.y += dt * 1.1;
    fl.spr.material.opacity = Math.max(0, 1 - fl.t / 1.3);
    if (fl.t > 1.3) { scene.remove(fl.spr); fl.spr.material.map.dispose(); fl.spr.material.dispose(); state.floats.splice(i, 1); }
  }

  listTimer += dt;
  if (listTimer > 0.5) { listTimer = 0; notifyResidents(); refreshButtons(); renderBreedHUD(); }
  hintTimer += dt;
  if (hintTimer > 2) { hintTimer = 0; updateHint(); }
  clockTimer += dt;
  if (clockTimer >= 1) { clockTimer = 0; updateClock(); }
  saveTimer -= dt;
  if (saveTimer <= 0) { saveTimer = 5; save(); }

  controls.update();
  _zoomDir.subVectors(camera.position, controls.target).normalize();
  const dNow = camera.position.distanceTo(controls.target);
  camera.position.copy(controls.target).addScaledVector(_zoomDir, dNow + (zoomGoal - dNow) * 0.18);
  renderer.render(scene, camera);
  if (!window.__FV_BOOTED) window.__FV_BOOTED = true;
}

// ---------- Offline catch-up (Ronde 13 — real time via lastSeen; rAF pause saat hidden, halaman mati saat closed) ----------
const OFFLINE_STEP = 0.25; // detik per langkah replay
function recordDeparture() { save(); } // checkpoint keberangkatan: save() men-stamp lastSeen (di dalam save())
document.addEventListener('visibilitychange', () => { if (document.hidden) recordDeparture(); else handleReturn(); });
window.addEventListener('pagehide', () => recordDeparture()); // close / reload / navigate / freeze (Memory Saver)
function handleReturn() {
  const meta = readMeta();
  if (!meta) return null;
  const away = Math.min(OFFLINE_MAX, Math.max(0, (Date.now() - meta.lastSeen) / 1000));
  if (away < 1) return null;
  const rep = applyAway(away);
  writeMeta(Date.now());
  if (away >= AWAY_REPORT_MIN) showAwayReport(rep, away);
  return rep;
}
function applyAway(sec) { return sec <= REPLAY_MAX ? awayReplay(sec) : awayAnalytic(sec); }
function snapshotAway() {
  return {
    fish: new Map(state.fish.map(f => [f.id, { name: f.name, stage: f.stage, senior: !!f.senior }])),
    chest: !!state.treasure,
    breed: state.breeding ? [state.breeding.a.name, state.breeding.b.name] : null,
  };
}
function buildReport(sec, snap) {
  const rep = { sec, born: [], stageUps: [], seniors: 0, passedAway: awayDeaths.slice(), chest: false, breed: null, starving: false }; // Ronde 14 — cause of death dari awayDeaths (diisi killFish)
  for (const f of state.fish) {
    const b = snap.fish.get(f.id);
    if (!b) rep.born.push(f.name);
    else {
      if (f.stage > b.stage) rep.stageUps.push(f.name);
      if (f.senior && !b.senior) rep.seniors++;
    }
  }
  rep.chest = !!state.treasure && !snap.chest;
  rep.breed = snap.breed && !state.breeding ? { names: snap.breed, n: null } : null;
  rep.starving = state.fish.some(f => f.hunger >= STARVE_TOAST);
  return rep;
}
function finishAway() { notifyResidents(); refreshButtons(); renderBreedHUD(); save(); }
function awayReplay(sec) {
  awayDeaths.length = 0; // Ronde 14 — reset pencatatan cause kematian
  const snap = snapshotAway();
  const steps = Math.floor(sec / OFFLINE_STEP); // Ronde 13 — cap fix: OFFLINE_CAP lama dihitung sebagai STEP (efektif 150 s); sekarang cap dalam detik (REPLAY_MAX)
  let t = clock.elapsedTime;
  for (let i = 0; i < steps; i++) {
    t += OFFLINE_STEP;
    for (const f of state.fish) updateFish(f, OFFLINE_STEP, t);
    updateEggs(OFFLINE_STEP, t);
    updateFoods(OFFLINE_STEP, t);
    updateBreeding(OFFLINE_STEP);
    updateTreasure(OFFLINE_STEP, t);
  }
  const rep = buildReport(sec, snap);
  finishAway();
  return rep;
}
function awayAnalytic(sec) {
  // absen panjang: hanya state, tanpa AI/scene (41 ikan × 24 jam ÷ 60 s langkah ≈ beberapa ms)
  const rep = { sec, born: [], stageUps: [], seniors: 0, passedAway: [], chest: false, breed: null, starving: false };
  awayDeaths.length = 0; // Ronde 14 — reset (ikan yang mulai mati di sini baru 'dead' di play langsung)
  for (const f of state.fish) {
    if (f.dying) continue;
    let left = sec;
    while (left > 0 && !f.dying) {
      const dt = Math.min(ANALYTIC_STEP, left);
      const stageMod = f.stage === 0 ? 1.15 : f.stage === 2 ? 0.9 : 1; // rumus sama dengan updateFish
      f.hunger = Math.min(100, f.hunger + HUNGER_DECAY * stageMod * dt);
      if (f.hunger >= 100) { // Ronde 14 — vonis kelaparan (rumus sama updateFish); growth pasif sudah dihapus
        f.starveT += dt;
        if (f.starveT >= STARVE_KILL[f.stage]) { startDying(f, 'starve'); rep.passedAway.push({ name: f.name, cause: 'starve' }); break; } // animasi kematian main setelah kembali
      }
      if (f.stage === 2) {
        f.age += dt;
        if (!f.senior && f.age > SENIOR_FRAC * ADULT_LIFESPAN) { f.senior = true; tintSenior(f); rep.seniors++; }
        if (f.age >= ADULT_LIFESPAN) { startDying(f); rep.passedAway.push({ name: f.name, cause: 'age' }); break; } // animasi kematian main setelah kembali
      }
      left -= dt;
    }
  }
  for (let i = state.eggs.length - 1; i >= 0; i--) {
    const e = state.eggs[i];
    e.h = Math.min(1, e.h + sec / HATCH_TIME);
    if (e.h < 1) continue;
    state.eggs.splice(i, 1);
    scene.remove(e.group);
    const g = e.genome || { species: Math.floor(Math.random() * SPECIES.length), traits: defaultTraits(), variant: false };
    const pos = e.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
    pos.x = THREE.MathUtils.clamp(pos.x, FISH_MIN.x, FISH_MAX.x);
    pos.z = THREE.MathUtils.clamp(pos.z, FISH_MIN.z, FISH_MAX.z);
    const f = spawnFry(pos, g.species, 0, null, 60, 0, g.traits, g.variant);
    rep.born.push(f.name);
  }
  for (let i = state.foods.length - 1; i >= 0; i--) { scene.remove(state.foods[i].m); state.foods.splice(i, 1); } // life ≤ 25 s ≪ absen panjang
  state.breedCd = Math.max(0, state.breedCd - sec);
  const br = state.breeding;
  if (br) {
    if (sec >= br.dur - br.t) {
      const [lo, hi] = eggRange(br.a, br.b);
      const n = lo + Math.floor(Math.random() * (hi - lo + 1));
      for (let i = 0; i < n; i++) {
        const p = br.mid.clone().add(new THREE.Vector3((Math.random() - 0.5) * 5, 0, (Math.random() - 0.5) * 4));
        p.x = THREE.MathUtils.clamp(p.x, FISH_MIN.x + 0.5, FISH_MAX.x - 0.5);
        p.z = THREE.MathUtils.clamp(p.z, FISH_MIN.z + 0.5, FISH_MAX.z - 0.5);
        makeEgg(p, 0, breedGenome(br.a, br.b));
      }
      state.breeding = null;
      state.breedCd = BREED_CD;
      rep.breed = { names: [br.a.name, br.b.name], n };
    } else br.t += sec;
  }
  if (!state.treasure) {
    state.treasureTimer = Math.max(0, state.treasureTimer - sec);
    if (state.treasureTimer <= 0) { spawnTreasure(null, false); rep.chest = true; } // chest menunggu, dilaporkan di away report
  }
  rep.starving = state.fish.some(f => f.hunger >= STARVE_TOAST);
  finishAway();
  return rep;
}

// ---------- Away report (Ronde 13 — modal "While you were away") ----------
function fmtDur(sec) {
  sec = Math.round(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${sec}s`;
}
function showAwayReport(rep, away) {
  const names = (arr, cap) => arr.length > cap ? `${arr.slice(0, cap).join(', ')} and ${arr.length - cap} more` : arr.join(', ');
  const rows = [];
  if (rep.born.length) rows.push(`${icon('egg', '#7dff9e')} ${rep.born.length} fry hatched: ${names(rep.born, 5)}`);
  if (rep.stageUps.length) rows.push(`${icon('fish', '#ffd34f')} ${rep.stageUps.length} fish grew up: ${names(rep.stageUps, 3)}`);
  if (rep.seniors) rows.push(`${icon('hourglass', '#c8d4e0')} ${rep.seniors} fish got old`);
  if (rep.passedAway.length) rep.passedAway.slice(0, 3).forEach(d => rows.push(`${icon('fish', '#ff6a4d')} ${d.name} ${d.cause === 'starve' ? 'passed away from starvation' : 'passed away at a ripe old age'}`)); // Ronde 14 — cause of death
  if (rep.breed) rows.push(`${icon('heart', '#ff7aa2')} ${rep.breed.names.join(' & ')} laid ${rep.breed.n != null ? rep.breed.n + ' eggs' : 'eggs'}`);
  if (rep.chest) rows.push(`${icon('chest', '#4fd1ff')} A treasure chest appeared — click it to open!`);
  if (rep.starving) rows.push(`${icon('fish', '#ff6a4d')} The fish are starving — feed them!`);
  if (!rows.length) rows.push('All quiet — the tank is as you left it.');
  $('awayTitle').innerHTML = `${icon('hourglass')} WHILE YOU WERE AWAY`;
  $('awaySub').textContent = `You were gone ${fmtDur(away)} — here's what happened in the tank.`;
  $('awayList').innerHTML = rows.map(r => `<div class="awayRow">${r}</div>`).join('');
  $('awayWrap').classList.remove('hidden');
  $('btnAwayClose').onclick = () => $('awayWrap').classList.add('hidden');
}

  spawnFry(new THREE.Vector3(3, 5, 2), 2, 8, null, 15);     // adult blue (full)
  spawnFry(new THREE.Vector3(0, 8.5, 0), 1, 4, null, 55);   // juvenile red
  spawnFry(new THREE.Vector3(-6, 4, 2), 4, 1, null, 85);    // fry golden (hungry)
  makeEgg(new THREE.Vector3(6, 0, 3), 0.4);
  spawnTreasure();
  state.treasureTimer = TREASURE_NEXT;
  toast('Demo tank loaded — feed, open the treasure chest, and breed!'); // Ronde 16 — collect koin dihapus
}

window.__FV = {
  scene, state, renderer, camera, controls,
  __SPECIES: SPECIES, __speciesGeometry: _speciesGeometry,
  forceTreasure() { if (!state.treasure) spawnTreasure(); return state.treasure; },
  ageFish(id, seconds) { const f = state.fish.find(x => x.id === id); if (f && f.stage === 2) f.age = Math.min(ADULT_LIFESPAN, f.age + seconds); return f; },
  setHunger(id, v) { const f = state.fish.find(x => x.id === id); if (f) f.hunger = Math.min(100, Math.max(0, v)); return f; },
  setTreasureTimer(s) { state.treasureTimer = s; return state.treasureTimer; }, // test hook (Ronde 8)
  setEggH(i, h) { const e = state.eggs[i]; if (e) e.h = Math.max(0, Math.min(0.999, h)); return e; }, // test hook (Ronde 10) — fast-forward hatching
  setFeedStock(n) { state.feedStock = Math.max(0, n | 0); feedLabel(); return state.feedStock; }, // test hook (Ronde 10.5)
  sellFish(id) { const f = state.fish.find(x => x.id === id); if (f) return { name: f.name, price: sellFish(f) }; return null; }, // test hook (Ronde 14) — jual ikan (bypass confirm)
  feedFish(id, n) { const f = state.fish.find(x => x.id === id); if (!f) return null; for (let i = 0; i < n; i++) { if (f.hunger < 25) f.hunger = 100; // ikan tetap bisa makan, sama seperti ikan kenyang lagi
    if (!state.foods.length) dropFlakes(1);
    eatFood(f, state.foods[0]);
  } return { hunger: f.hunger, growth: f.growth, stage: f.stage, starveT: f.starveT }; }, // test hook (Ronde 14) — n flake via jalur eatFood asli (growth hanya dari makan)
  simAway(sec) { writeMeta(Date.now() - sec * 1000); return handleReturn(); }, // test hook (Ronde 13) — jalankan jalur return sungguhan
  pokeFish(id) { const f = state.fish.find(x => x.id === id); if (f) pokeFish(f, f.group.position.clone()); return f; }, // test hook (Ronde 11)
  moods() { return Object.fromEntries(state.fish.map(f => [f.id, f.mood])); }, // test hook (Ronde 11) — snapshot mood per-ikan
  spawnSpecies(i, traits, variant) { const pos = new THREE.Vector3((Math.random() * 8 - 4), 4 + Math.random() * 4, (Math.random() * 8 - 4)); return spawnFry(pos, i % SPECIES.length, 8, null, 15, 0, traits || undefined, !!variant); },
  simBreed(n, mode, ta, tb) {
    ta = ta || { size: 1, speed: 1, hue: 0 }; tb = tb || ta;
    const A = { speciesIdx: 0, traits: ta }, B = { speciesIdx: mode === 'cross' ? 1 : 0, traits: tb };
    const spCount = {}, out = [];
    for (let i = 0; i < n; i++) { const g = breedGenome(A, B); spCount[g.species] = (spCount[g.species] || 0) + 1; out.push(g); }
    const mean = k => out.reduce((s, g) => s + g.traits[k], 0) / n;
    const ext = k => [Math.min(...out.map(g => g.traits[k])), Math.max(...out.map(g => g.traits[k]))];
    return { n, split: spCount, variantPct: 100 * out.filter(g => g.variant).length / n, sizeMean: mean('size'), speedMean: mean('speed'), hueMean: mean('hue'), sizeRange: ext('size'), hueRange: ext('hue') };
  },
  fps() { return window.__FV.__fps || 0; },
};

// ---------- Boot ----------
load();
if (location.hash === '#demo') seedDemo();
else handleReturn(); // Ronde 13 — real time: catch-up dari lastSeen (lewati di #demo — tank di-reseed)
refreshButtons();
updateHint();
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
